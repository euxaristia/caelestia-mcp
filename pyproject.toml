[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caelestia-mcp"
version = "1.0.0"
description = "Model Context Protocol (MCP) server for Caelestia shell and Hyprland"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "euxaristia" },
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
]

[project.scripts]
caelestia-mcp = "caelestia_mcp.server:main"
